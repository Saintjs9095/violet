name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Locate Project Root
        id: locate
        run: |
          PROJ_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory is: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter pub get

      - name: Reconfigure Xcode Project Targets
        working-directory: ${{ steps.locate.outputs.proj_dir }}/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Ruby xcodeproj로 ShareExtension 및 충돌 스크립트 제거
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("Runner.xcodeproj")

            share_target = project.targets.find { |t| t.name == "ShareExtension" }
            share_target.remove_from_project if share_target

            runner_target = project.targets.find { |t| t.name == "Runner" }
            if runner_target
              runner_target.dependencies.delete_if do |dep|
                dep.target.nil? || dep.target.name == "ShareExtension" || (dep.respond_to?(:display_name) && dep.display_name.to_s.include?("ShareExtension"))
              end
              runner_target.build_phases.delete_if do |phase|
                phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name.to_s.include?("Extension") ||
                (phase.respond_to?(:name) && phase.name.to_s.include?("Crashlytics"))
              end

              runner_target.build_configurations.each do |config|
                config.build_settings["DEVELOPMENT_TEAM"] = "7QZ8ABC99X"
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["CODE_SIGN_IDENTITY"] = ""
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              end
            end

            project.build_configurations.each do |config|
              config.build_settings["DEVELOPMENT_TEAM"] = "7QZ8ABC99X"
            end

            project.save
          '

          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "DEVELOPMENT_TEAM = 7QZ8ABC99X" >> "$cfg"
          done

      - name: Build Flutter iOS App Bundle
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Preparing Payload for SideStore ==="
          
          # 1. 빌드 폴더 내 Runner.app 탐색
          TARGET_APP="${{ steps.locate.outputs.proj_dir }}/build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$TARGET_APP" ]; then
            TARGET_APP=$(find /Users/runner/work -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)
          fi

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$TARGET_APP" Payload/

          # 2. Info.plist 보강 및 템플릿 변수 실값 완전 치환
          PLIST_PATH="Payload/Runner.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            cp "${{ steps.locate.outputs.proj_dir }}/ios/Runner/Info.plist" "$PLIST_PATH"
          fi

          sed -i '' 's/\$(EXECUTABLE_NAME)/Runner/g' "$PLIST_PATH"
          sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/xyz.project.violet/g' "$PLIST_PATH"
          sed -i '' 's/\$(PRODUCT_NAME)/Violet/g' "$PLIST_PATH"
          sed -i '' 's/\$(FLUTTER_BUILD_NAME)/1.34.3/g' "$PLIST_PATH"
          sed -i '' 's/\$(FLUTTER_BUILD_NUMBER)/1/g' "$PLIST_PATH"

          # 3. 진짜 컴파일된 실행 바이너리 주입 (Bad file descriptor 원인 해결)
          echo "Searching true compiled Runner Mach-O binary..."
          REAL_BIN=$(find /Users/runner/work "$HOME/Library/Developer/Xcode/DerivedData" -type f -name "Runner" -perm +111 -size +1M 2>/dev/null | head -n 1)
          
          if [ -z "$REAL_BIN" ]; then
            REAL_BIN=$(find /Users/runner/work "$HOME/Library/Developer/Xcode/DerivedData" -type f -name "Runner" -size +1M 2>/dev/null | head -n 1)
          fi

          if [ -n "$REAL_BIN" ]; then
            echo "Injecting verified binary from: $REAL_BIN"
            cp -f "$REAL_BIN" "Payload/Runner.app/Runner"
            chmod 755 "Payload/Runner.app/Runner"
          else
            echo "::error::No valid compiled Runner binary found above 1MB!"
            find /Users/runner/work "$HOME/Library/Developer/Xcode/DerivedData" -name "Runner" -ls || true
            exit 1
          fi

          # 4. 바이너리 정상 확인
          file "Payload/Runner.app/Runner"
          ls -lh "Payload/Runner.app/Runner"

          # 플러그인 확장 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa