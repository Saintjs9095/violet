name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Pre-build Flutter Frameworks
        working-directory: violet
        run: |
          flutter build ios --config-only --no-codesign

      - name: Configure Scheme and Remove ShareExtension
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 타깃 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. Runner Scheme 파일에서 ShareExtension 빌드 엔트리 XML 삭제
          python3 -c '
          import os, glob
          import xml.etree.ElementTree as ET

          schemes = glob.glob("**/*.xcscheme", recursive=True)
          for s in schemes:
              try:
                  tree = ET.parse(s)
                  root = tree.getroot()
                  for build_action_entry in root.findall(".//BuildActionEntry"):
                      for ref in build_action_entry.findall("BuildableReference"):
                          if "ShareExtension" in ref.attrib.get("BlueprintName", ""):
                              parent = root.find(".//BuildActionEntries")
                              if parent is not None:
                                  parent.remove(build_action_entry)
                  tree.write(s)
                  print("Patched scheme:", s)
              except Exception as e:
                  print("Skip:", s, e)
          '

          # 3. Release 및 Generated 설정에 무서명 오버라이드
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Build Runner App with xcodebuild
        working-directory: violet/ios
        run: |
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find violet/build_output -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found under build_output, searching elsewhere..."
            APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Compiled Runner.app not found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore/AltStore 충돌 방지: 잔여 확장 제거
          rm -rf Payload/Runner.app/PlugIns || true

          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Size ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa