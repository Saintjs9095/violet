name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Locate Project Root
        id: locate
        run: |
          PROJ_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory is: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter pub get

      - name: Implement Proper Salt & Wsalt Handlers
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          mkdir -p lib/server

          # crypto 패키지를 이용한 정규 토큰 해싱 구현체 주입
          cat << 'EOF' > lib/server/salt.dart
          import 'dart:convert';
          import 'package:crypto/crypto.dart';

          String getValid(String token) {
            final bytes = utf8.encode(token + 'violet');
            return sha256.convert(bytes).toString();
          }
          EOF

          cat << 'EOF' > lib/server/wsalt.dart
          import 'dart:convert';
          import 'package:crypto/crypto.dart';

          String getValid(String token) {
            final bytes = utf8.encode(token + 'violet_wsalt');
            return sha256.convert(bytes).toString();
          }
          EOF

          echo "Successfully injected proper crypto-backed salt.dart and wsalt.dart"

      - name: Verify Dart Compilation
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter build bundle

      - name: Decouple ShareExtension and Clean Project Safe
        working-directory: ${{ steps.locate.outputs.proj_dir }}/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Ruby xcodeproj로 타깃 정리 및 Crashlytics 무력화
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("Runner.xcodeproj")

            share_target = project.targets.find { |t| t.name == "ShareExtension" }
            share_target.remove_from_project if share_target

            runner_target = project.targets.find { |t| t.name == "Runner" }
            if runner_target
              runner_target.dependencies.delete_if do |dep|
                dep.target.nil? || dep.target.name == "ShareExtension" || (dep.respond_to?(:display_name) && dep.display_name.to_s.include?("ShareExtension"))
              end

              runner_target.build_phases.delete_if do |phase|
                (phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name.to_s.include?("Extension")) ||
                (phase.respond_to?(:name) && phase.name.to_s.include?("Crashlytics")) ||
                (phase.respond_to?(:shell_script) && phase.shell_script.to_s.include?("crashlytics"))
              end

              runner_target.build_configurations.each do |config|
                config.build_settings["DEVELOPMENT_TEAM"] = "7QZ8ABC99X"
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["CODE_SIGN_IDENTITY"] = ""
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              end
            end

            project.build_configurations.each do |config|
              config.build_settings["DEVELOPMENT_TEAM"] = "7QZ8ABC99X"
            end

            project.save
          '

          # 3. xcscheme에서 ShareExtension 제거
          python3 -c '
          import xml.etree.ElementTree as ET
          import glob

          for p in glob.glob("**/*.xcscheme", recursive=True):
              try:
                  tree = ET.parse(p)
                  root = tree.getroot()
                  changed = False
                  for entries in root.findall(".//BuildActionEntries"):
                      for entry in list(entries):
                          ref = entry.find("BuildableReference")
                          if ref is not None and "ShareExtension" in ref.attrib.get("BlueprintName", ""):
                              entries.remove(entry)
                              changed = True
                  if changed:
                      tree.write(p)
              except Exception:
                  pass
          '

          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "DEVELOPMENT_TEAM = 7QZ8ABC99X" >> "$cfg"
            echo "CODE_SIGN_IDENTITY =" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
          done

      - name: Build Runner App via Flutter Pipeline
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          PROJ_DIR="${{ steps.locate.outputs.proj_dir }}"

          TARGET_APP="$PROJ_DIR/build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$TARGET_APP" ]; then
            TARGET_APP=$(find /Users/runner/work "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)
          fi

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$TARGET_APP" Payload/

          PLIST_PATH="Payload/Runner.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            cp "$PROJ_DIR/ios/Runner/Info.plist" "$PLIST_PATH"
          fi

          plutil -convert xml1 "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Runner" "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier xyz.project.violet" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string xyz.project.violet" "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleName Violet" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string Violet" "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.34.3" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.34.3" "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$PLIST_PATH" 2>/dev/null || true

          # 네트워크 전체 허용 (ATS 해제)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST_PATH" 2>/dev/null || true

          chmod 755 "Payload/Runner.app/Runner" || true
          rm -rf Payload/Runner.app/PlugIns || true

          zip -r -q Violet.ipa Payload
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa