name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Install Pods
        working-directory: violet/ios
        run: pod install

      - name: Patch FirebaseCoreInternal Swift Syntax
        working-directory: violet/ios
        run: |
          TARGET_LOCK="Pods/FirebaseCoreInternal/FirebaseCore/Internal/Sources/Utilities/UnfairLock.swift"
          TARGET_PAYLOAD="Pods/FirebaseCoreInternal/FirebaseCore/Internal/Sources/HeartbeatLogging/HeartbeatsPayload.swift"

          for FILE in "$TARGET_LOCK" "$TARGET_PAYLOAD"; do
            if [ -f "$FILE" ]; then
              echo "Patching $FILE..."
              # sending, consuming, borrowing 키워드 제거
              sed -i '' 's/sending //g' "$FILE"
              sed -i '' 's/consuming //g' "$FILE"
              sed -i '' 's/borrowing //g' "$FILE"
              # 모든 접근 제어자가 붙은 import를 순수 import로 변환
              sed -i '' -E 's/^[[:space:]]*(public|internal|private|fileprivate|package)[[:space:]]+import/import/g' "$FILE"
            fi
          done

      - name: Build iOS (No codesign)
        working-directory: violet
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir Payload
          cp -r violet/build/ios/iphoneos/Runner.app Payload/
          zip -r Violet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa