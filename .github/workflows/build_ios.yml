name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Patch project and podfile configurations
        working-directory: violet/ios
        run: |
          # 1. Release.xcconfig와 Generated.xcconfig에 무서명 명시
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
          done

          # 2. pbxproj 내 서명 수동화
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Build Flutter iOS App (Allow Signing Verification Exit)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter CLI는 실제 앱 번들을 온전히 빌드해 둔 후,
          # 마지막 단계에서 Provisioning Profile이 없다는 이유로 exit 1을 냅니다.
          # 따라서 명령 실패를 허용( || true )하고 실제 결과물(Runner.app)의 존재 여부를 다음 단계에서 검증합니다.
          flutter build ios --release --no-codesign || true

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find violet/build/ios -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find violet -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app was not generated by Flutter!"
            exit 1
          fi

          echo "Found compiled app bundle: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Violet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa