name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Patch project and podfile configurations
        working-directory: violet/ios
        run: |
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
          done

          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          with open(path, "w") as f:
              f.write(content)
          '

  - name: Build Flutter iOS App
    working-directory: violet
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    run: |
      flutter build ios --release --no-codesign || true

  - name: Package Payload into IPA (Standard Spec)
    run: |
      # 1. 빌드된 Runner.app 경로 탐색
      APP_PATH=$(find violet/build/ios -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
      if [ -z "$APP_PATH" ]; then
        APP_PATH=$(find violet -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
      fi

      echo "Using compiled Runner.app from: $APP_PATH"

      # 2. 작업용 패키지 폴더 초기화
      rm -rf ipa_build Violet.ipa
      mkdir -p ipa_build/Payload

      # 3. Runner.app을 Payload 바로 아래로 복사
      cp -R "$APP_PATH" ipa_build/Payload/

      # 4. SideStore / AltStore 앱 ID 초과 및 서명 충돌 방지를 위해 미사용 플러그인 확장(PlugIns) 정리
      rm -rf ipa_build/Payload/Runner.app/PlugIns/ShareExtension.appex || true

      # 5. 표준 zip 명령어로 압축 (Payload 폴더 바로 위에서 압축 수행)
      cd ipa_build
      zip -qr ../Violet.ipa Payload
      cd ..

      # 구조 검증 출력
      unzip -l Violet.ipa | head -n 10

  - name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Violet-Custom-IPA
      path: Violet.ipa