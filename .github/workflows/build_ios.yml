name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Strip Signing from Xcode Configuration
        working-directory: violet/ios
        run: |
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Build Flutter IPA (Unsigned Archive)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 259초 동안 아카이브를 정상 생성하고 서명 경고만 pass
          flutter build ipa --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app ==="
          
          # 1. 아카이브 기본 위치 및 워크스페이스 전역 탐색
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/Archives" -type d -name "Runner.app" 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_WORKSPACE" -type d -name "Runner.app" | grep -E "Products/Applications|Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Listing potential paths:"
            find "$RUNNER_WORKSPACE" -maxdepth 5 -type d -name "*archive*" || true
            echo "::error::Compiled Runner.app not found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # 2. 작업 디렉터리에 표준 Payload 구성
          rm -rf ipa_build Violet.ipa
          mkdir -p ipa_build/Payload
          cp -R "$APP_PATH" ipa_build/Payload/

          # SideStore 충돌 방지: 불필요한 플러그인 확장 정리
          rm -rf ipa_build/Payload/Runner.app/PlugIns || true

          # 3. Payload 디렉터리 압축
          cd ipa_build
          zip -r -q ../Violet.ipa Payload
          cd ..

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa