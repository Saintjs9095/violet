name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Locate Project Root
        id: locate
        run: |
          PROJ_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory is: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter pub get

      - name: Decouple ShareExtension
        working-directory: ${{ steps.locate.outputs.proj_dir }}/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Ruby xcodeproj로 ShareExtension 타깃 완전 분리
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("Runner.xcodeproj")
            share_target = project.targets.find { |t| t.name == "ShareExtension" }
            share_target.remove_from_project if share_target

            runner_target = project.targets.find { |t| t.name == "Runner" }
            if runner_target
              runner_target.dependencies.delete_if do |dep|
                dep.target.nil? || dep.target.name == "ShareExtension" || (dep.respond_to?(:display_name) && dep.display_name.to_s.include?("ShareExtension"))
              end
              runner_target.build_phases.delete_if do |phase|
                phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name.to_s.include?("Extension")
              end
            end
            project.save
          '

      - name: Build Flutter iOS App Bundle
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 5분간 온전한 릴리즈 AOT 컴파일 수행
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Application Bundle ==="
          
          # 시스템 전체에서 Info.plist가 존재하는 실제 .app 번들 탐색
          APP_PATH=""
          while IFS= read -r candidate; do
            if [ -f "$candidate/Info.plist" ]; then
              # 해당 번들 내에 메인 바이너리가 실제로 존재하는지 검증
              EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$candidate/Info.plist" 2>/dev/null || echo "Runner")
              if [ -f "$candidate/$EXEC_NAME" ]; then
                APP_PATH="$candidate"
                echo "Discovered verified bundle with executable at: $APP_PATH"
                break
              fi
            fi
          done < <(find /Users/runner/work -type d -name "*.app" 2>/dev/null | grep -E "Release-iphoneos")

          # 2차 탐색: 시스템 전체에서 탐색
          if [ -z "$APP_PATH" ]; then
            echo "Searching all system locations..."
            while IFS= read -r candidate; do
              if [ -f "$candidate/Info.plist" ]; then
                APP_PATH="$candidate"
                echo "Discovered fallback bundle: $APP_PATH"
                break
              fi
            done < <(find /Users/runner -type d -name "*.app" 2>/dev/null | grep -E "Release-iphoneos")
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Compiled Application bundle could not be found!"
            find /Users/runner/work -maxdepth 6 -name "*.app" || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -la "$APP_PATH"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 잔여 플러그인 확장 폴더 제거
          rm -rf Payload/*.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa