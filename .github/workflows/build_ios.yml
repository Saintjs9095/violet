name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Pre-build Flutter Frameworks
        working-directory: violet
        run: |
          # Flutter가 Runner에 필요한 App.framework 및 Flutter.framework를 빌드하도록 유도
          flutter build ios --config-only --no-codesign

      - name: Prepare Pods and Disable All Codesigning
        working-directory: violet/ios
        run: |
          # 1. ShareExtension을 Podfile 및 프로젝트에서 완전 배제
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. Release.xcconfig 및 Generated.xcconfig에 강제 무서명 설정
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Build Runner App with xcodebuild
        working-directory: violet/ios
        run: |
          # Scheme 대신 Runner 프로젝트의 Runner 타깃만 단독 빌드 (-target Runner)
          xcodebuild build \
            -project Runner.xcodeproj \
            -target Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          # 빌드된 Runner.app 실제 위치 확인
          APP_PATH=$(find violet/build_output -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found under build_output, checking all paths..."
            APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Built app bundle was not found or invalid!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore/AltStore 규격용 정리
          rm -rf Payload/Runner.app/PlugIns || true

          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Size ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa