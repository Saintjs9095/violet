name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Prepare Flutter Frameworks
        working-directory: violet
        run: |
          # Flutter가 iOS 네이티브 빌드에 필요한 모든 에셋 및 프레임워크를 준비하도록 실행
          flutter build ios --config-only --release --no-codesign

      - name: Strip Signing and Configure Pods
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. 모든 빌드 설정 파일에 무서명 주입
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Archive Runner via xcodebuild
        working-directory: violet/ios
        run: |
          # xcodebuild archive 명령으로 서명 없이 순수 아카이브 생성
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Violet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into SideStore IPA
        run: |
          ARCHIVE_APP="$RUNNER_TEMP/Violet.xcarchive/Products/Applications/Runner.app"

          if [ ! -d "$ARCHIVE_APP" ]; then
            echo "Searching all folders in RUNNER_TEMP for Runner.app..."
            ARCHIVE_APP=$(find "$RUNNER_TEMP" -type d -name "Runner.app" | head -n 1)
          fi

          if [ -z "$ARCHIVE_APP" ] || [ ! -f "$ARCHIVE_APP/Info.plist" ]; then
            echo "::error::Compiled Runner.app not found in archive!"
            exit 1
          fi

          echo "Found compiled app bundle at: $ARCHIVE_APP"
          ls -lh "$ARCHIVE_APP/Runner"

          # Payload 디렉터리 구성
          rm -rf ipa_build Violet.ipa
          mkdir -p ipa_build/Payload
          cp -R "$ARCHIVE_APP" ipa_build/Payload/

          # SideStore/무료 계정 App ID 충돌 방지를 위해 미사용 익스텐션 제거
          rm -rf ipa_build/Payload/Runner.app/PlugIns || true

          # 표준 zip 압축
          cd ipa_build
          zip -r -q ../Violet.ipa Payload
          cd ..

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa