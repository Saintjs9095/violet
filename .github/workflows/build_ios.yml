name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Remove ShareExtension Completely
        working-directory: violet/ios
        run: |
          # 1. ShareExtension 디렉터리 물리 삭제
          rm -rf ShareExtension

          # 2. Scheme 파일에서 ShareExtension 참조 제거
          find Runner.xcodeproj -name "*.xcscheme" -exec sed -i '' '/ShareExtension/d' {} + || true

          # 3. Podfile에서 ShareExtension 블록 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '

          # 4. project.pbxproj에서 ShareExtension 완벽 제거 및 무서명 강제
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              lines = f.readlines()
          new_lines = [l for l in lines if "ShareExtension" not in l]
          content = "".join(new_lines)
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Install Pods
        working-directory: violet/ios
        run: pod install

      - name: Build Runner App
        working-directory: violet
        run: |
          # flutter build를 통해 바이너리, 에셋, 플러그인을 완전히 컴파일
          # 끝날 때 서명 체크로 exit 1이 발생해도 번들은 완성되므로 무시하고 진행
          flutter build ios --release --no-codesign || true

      - name: Verify and Package IPA
        run: |
          echo "=== Searching for compiled Runner.app ==="
          # 크기가 1MB 이상인 진짜 Runner 실행 파일이 들어있는 Runner.app 찾기
          APP_PATH=""
          for candidate in $(find "$GITHUB_WORKSPACE" -type d -name "Runner.app"); do
            if [ -f "$candidate/Runner" ] && [ -f "$candidate/Info.plist" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "Direct Runner.app with binary not found. Searching build products..."
            find "$GITHUB_WORKSPACE/violet/build" -maxdepth 5 -ls || true
            echo "::error::No compiled Runner binary found!"
            exit 1
          fi

          echo "Found compiled app bundle: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore/AltStore 규격용 정리
          rm -rf Payload/Runner.app/PlugIns || true

          zip -r -q Violet.ipa Payload

          echo "=== Final IPA Size ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa