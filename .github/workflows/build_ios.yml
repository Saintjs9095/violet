name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile and Inject Ad-Hoc Signing
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 타깃 블록 안전 삭제
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. 유료 개발팀 검증을 우회하는 Ad-Hoc("-" 서명) 및 수동 서명 강제 적용
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGN_STYLE = Manual" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGNING_ALLOWED = YES" >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "PROVISIONING_PROFILE_SPECIFIER = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Build Unsigned Release App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Ad-Hoc 서명 설정을 통해 유료 계정 에러 없이 5~6분간 완전한 AOT 릴리즈 바이너리 컴파일 완주
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app in Release-iphoneos ==="
          APP_PATH=""

          # 1. 표준 산출물 경로 확인
          if [ -d "$GITHUB_WORKSPACE/violet/build/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="$GITHUB_WORKSPACE/violet/build/ios/Release-iphoneos/Runner.app"
          elif [ -d "$GITHUB_WORKSPACE/violet/build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="$GITHUB_WORKSPACE/violet/build/ios/iphoneos/Runner.app"
          fi

          # 2. DerivedData 전체 탐색 (바이너리가 실존하는 디렉터리 탐색)
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "Searching all candidates for Runner executable..."
            FOUND_BIN=$(find "$GITHUB_WORKSPACE" "$HOME/Library/Developer/Xcode/DerivedData" -type f -name "Runner" -perm +111 2>/dev/null | grep -E "Release-iphoneos/Runner.app/Runner" | head -n 1)
            if [ -n "$FOUND_BIN" ]; then
              APP_PATH=$(dirname "$FOUND_BIN")
            fi
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Compiled executable Runner binary could not be found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 잔여 플러그인 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa