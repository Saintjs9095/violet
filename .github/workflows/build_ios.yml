name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile and Disable ShareExtension
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. xcconfig에 서명 비활성화 주입
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
          done

      - name: Build and Preserve App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          mkdir -p "$RUNNER_TEMP/saved_bundle"

          # 빌드 도중 실시간으로 생성되는 Runner 바이너리와 에셋을 실시간 동기화
          (
            echo "Starting continuous bundle synchronization..."
            TARGET_APP="$GITHUB_WORKSPACE/violet/build/ios/Release-iphoneos/Runner.app"
            while true; do
              if [ -f "$TARGET_APP/Runner" ] && [ -s "$TARGET_APP/Runner" ]; then
                cp -R "$TARGET_APP" "$RUNNER_TEMP/saved_bundle/" 2>/dev/null || true
              fi
              sleep 0.1
            done
          ) &
          SYNC_PID=$!

          # 전체 릴리즈 컴파일 실행 (팀 누락 검증 실패로 exit 1이 나더라도 계속 진행)
          flutter build ios --release --no-codesign || true

          # 동기화 프로세스 종료
          kill $SYNC_PID 2>/dev/null || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app ==="
          APP_PATH="$RUNNER_TEMP/saved_bundle/Runner.app"

          if [ ! -d "$APP_PATH" ] || [ ! -s "$APP_PATH/Runner" ]; then
            echo "Searching build directory fallback..."
            APP_PATH=$(find "$GITHUB_WORKSPACE/violet/build" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)
          fi

          if [ ! -d "$APP_PATH" ] || [ ! -s "$APP_PATH/Runner" ]; then
            echo "::error::Compiled executable Runner binary could not be captured!"
            ls -la "$RUNNER_TEMP/saved_bundle" || true
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Found Complete App Bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 플러그인 확장 폴더 정리
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa