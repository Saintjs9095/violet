name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Decouple ShareExtension and Set Ad-Hoc Signing
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 타깃 안전 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Ruby xcodeproj로 ShareExtension 제거 및 Ad-Hoc('-') 서명 적용
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("Runner.xcodeproj")

            # ShareExtension 타깃 삭제
            share_target = project.targets.find { |t| t.name == "ShareExtension" }
            if share_target
              puts "Removing ShareExtension target..."
              share_target.remove_from_project
            end

            # Runner 타깃 의존성 및 Embed 확장 정리
            runner_target = project.targets.find { |t| t.name == "Runner" }
            if runner_target
              runner_target.dependencies.delete_if do |dep|
                dep.target.nil? || dep.target.name == "ShareExtension" || (dep.respond_to?(:display_name) && dep.display_name.to_s.include?("ShareExtension"))
              end
              runner_target.build_phases.delete_if do |phase|
                phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name.to_s.include?("Extension")
              end
            end

            # Runner 타깃에 Ad-Hoc 서명 설정 주입
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["CODE_SIGN_IDENTITY"] = "-"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGNING_ALLOWED"] = "YES"
                config.build_settings["DEVELOPMENT_TEAM"] = ""
                config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ""
              end
            end

            project.save
            puts "Project configured successfully!"
          '

      - name: Build Unsigned Release App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Application Bundle ==="
          APP_PATH=""

          # 1. Info.plist가 실존하는 모든 .app 디렉터리 탐색
          while IFS= read -r candidate; do
            if [ -f "$candidate/Info.plist" ]; then
              APP_PATH="$candidate"
              echo "Discovered app candidate: $APP_PATH"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/violet/build" "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "*.app" 2>/dev/null | grep -E "Release-iphoneos|iphoneos")

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No compiled .app bundle found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -la "$APP_PATH"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 잔여 플러그인 확장 폴더 제거
          rm -rf Payload/*.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa