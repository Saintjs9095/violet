name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Patch project configurations
        working-directory: violet/ios
        run: |
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          with open(path, "w") as f:
              f.write(content)
          '
          echo "CODE_SIGNING_ALLOWED = NO" >> Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> Flutter/Release.xcconfig

      - name: Build Flutter iOS App (Release)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter CLI는 실제 앱 번들을 온전히 빌드한 뒤 마지막 서명 단계에서 멈추므로 넘어가도록 처리
          flutter build ios --release --no-codesign || true

      - name: Package Real IPA
        run: |
          # 1. 빌드된 Runner.app 실제 위치 확인
          echo "=== Searching for Runner.app ==="
          APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | grep -v "DerivedData" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found in standard paths. Searching everywhere..."
            APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app could not be found anywhere!"
            exit 1
          fi

          echo "Target App Bundle: $APP_PATH"
          echo "=== App Bundle Contents ==="
          ls -la "$APP_PATH"

          # 2. 최상위 루트 디렉터리에 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload

          # Runner.app 통째로 복사
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 불필요한 확장 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 3. zip 압축 (루트 경로에서 단일 실행)
          zip -r -q Violet.ipa Payload

          # 4. 파일 크기 검증 (바이트 수가 너무 작으면 실패 처리)
          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "::error::Violet.ipa size is too small ($IPA_SIZE bytes). Build did not produce a full binary!"
            exit 1
          fi

          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa