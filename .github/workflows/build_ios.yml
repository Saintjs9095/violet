name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: false

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile and Force Rebuild Flutter Tools
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. Flutter CLI의 Development Team 강제 검증 로직 영구 무력화
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(cd $(dirname "$FLUTTER_BIN")/.. && pwd)
          echo "Flutter Root is: $FLUTTER_ROOT"

          # mac.dart 내부의 Development Team 에러를 통과하도록 패치
          find "$FLUTTER_ROOT/packages/flutter_tools" -name "*.dart" -exec sed -i '' 's/throwToolExit(_developmentTeamMissingError/print(_developmentTeamMissingError/g' {} +

          # 중요: 기존 바이너리 캐시를 제거하여 수정한 Dart 코드로 즉시 재빌드 유도
          rm -rf "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"
          rm -rf "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"

      - name: Build Unsigned Release App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 재컴파일된 flutter_tools로 온전한 기기용 Release 번들 생성 (검증 에러 없이 완주)
          flutter build ios --release --no-codesign

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app ==="
          APP_PATH=""

          for candidate in \
            "$GITHUB_WORKSPACE/violet/build/ios/iphoneos/Runner.app" \
            "$GITHUB_WORKSPACE/violet/build/ios/Release-iphoneos/Runner.app" \
            $(find "$GITHUB_WORKSPACE/violet/build" -type d -name "Runner.app" 2>/dev/null | head -n 1); do
            if [ -d "$candidate" ] && [ -f "$candidate/Info.plist" ] && [ -s "$candidate/Runner" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "::error::Compiled Runner.app not found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          # IPA 세부 정보 및 용량 검증
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa