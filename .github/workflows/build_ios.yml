name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Strip Signing from Xcode Configuration
        working-directory: violet/ios
        run: |
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Build Flutter IPA (Unsigned Archive)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter 공식 ipa 아카이브 명령어 (서명 단계 생략)
          flutter build ipa --release --no-codesign

      - name: Package Payload into SideStore IPA
        run: |
          # 1. Flutter 빌드로 생성된 xcarchive 내부의 실제 Runner.app 추출
          APP_PATH=$(find violet/build/ios/archive -name "Runner.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find violet/build -name "Runner.app" -type d | grep "iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Compiled Runner.app not found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # 2. SideStore용 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore/무료 계정 App ID 충돌 방지를 위해 미사용 익스텐션 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 3. 표준 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa