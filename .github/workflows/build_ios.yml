name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Build and Intercept App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          mkdir -p "$RUNNER_TEMP/saved_app"

          # 백그라운드에서 실시간으로 생성되는 Runner.app 바이너리를 낚아채는 데몬
          (
            echo "Starting continuous app interceptor daemon..."
            while true; do
              # DerivedData 및 Archives 디렉터리 내 완성된 Runner.app 탐색
              FOUND=$(find "$HOME/Library/Developer/Xcode" "$GITHUB_WORKSPACE" -type f -name "Info.plist" 2>/dev/null | grep -E "Runner.app/Info.plist" | head -n 1)
              if [ -n "$FOUND" ]; then
                APP_DIR=$(dirname "$FOUND")
                if [ -f "$APP_DIR/Runner" ] && [ -s "$APP_DIR/Runner" ]; then
                  cp -R "$APP_DIR" "$RUNNER_TEMP/saved_app/" 2>/dev/null || true
                fi
              fi
              sleep 1
            done
          ) &
          DAEMON_PID=$!

          # 완벽한 258초 AOT + Swift 컴파일 수행
          flutter build ipa --release --no-codesign || true

          # 데몬 종료
          kill $DAEMON_PID 2>/dev/null || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Checking Intercepted Bundle ==="
          APP_PATH="$RUNNER_TEMP/saved_app/Runner.app"

          if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "Deep searching fallback..."
            APP_PATH=$(find "$RUNNER_TEMP" "$HOME/Library/Developer" "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Compiled executable Runner binary could not be captured!"
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 표준 ZIP 압축
          zip -r -q Violet.ipa Payload

          # IPA 용량 검증
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa