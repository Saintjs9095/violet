name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Configure Project for Unsigned Build
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Xcode 프로젝트에서 ShareExtension 참조 완전히 제거
          sed -i '' '/ShareExtension/d' Runner.xcodeproj/project.pbxproj || true

          # 3. Xcode 프로젝트 전체에 서명 면제 및 더미 팀 주입 (Flutter의 뒷정리 삭제 로직 방지)
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "1234567890";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj

          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = 1234567890" >> "$cfg"
          done

      - name: Build Flutter iOS App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 불필요한 인자 없이 380초간 정규 AOT 컴파일 수행
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app ==="
          APP_PATH=""

          # 1. 릴리즈 빌드 결과물 경로 탐색
          for candidate in \
            "$GITHUB_WORKSPACE/violet/build/ios/Release-iphoneos/Runner.app" \
            "$GITHUB_WORKSPACE/violet/build/ios/iphoneos/Runner.app" \
            $(find "$GITHUB_WORKSPACE/violet/build" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1) \
            $(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1); do
            if [ -d "$candidate" ] && [ -f "$candidate/Info.plist" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "::error::Compiled Runner.app not found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -la "$APP_PATH"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa