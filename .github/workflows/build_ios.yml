name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Remove ShareExtension to prevent Signing Failure
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 관련 의존성 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          # 2. project.pbxproj 내 모든 서명 요구 강제 비활성화
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Build Flutter iOS App (Engine & Bundle)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter 빌드를 수행하여 App.framework 및 Flutter.framework 정상 생성
          flutter build ios --release --no-codesign || true

      - name: Package Real IPA
        run: |
          # 실제 바이너리가 담긴 Release-iphoneos/Runner.app 탐색
          APP_PATH=$(find violet/build/ios -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find violet -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          fi

          echo "Found compiled app bundle at: $APP_PATH"

          # 700바이트 껍데기 방지: Info.plist 및 바이너리 존재 검증
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Valid Runner.app bundle not found!"
            exit 1
          fi

          rm -rf ipa_build Violet.ipa
          mkdir -p ipa_build/Payload
          cp -R "$APP_PATH" ipa_build/Payload/

          # SideStore 충돌 요소(익스텐션) 제거
          rm -rf ipa_build/Payload/Runner.app/PlugIns || true

          # 표준 압축
          cd ipa_build
          zip -qr ../Violet.ipa Payload
          cd ..

          echo "Generated IPA Size:"
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa