name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Prepare Workspace and Pods
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 블록 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Build Runner Release Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter 공식 빌드를 수행하되, 서명 검사로 인한 종료(exit 1)를 통과시킵니다.
          flutter build ios --release --no-codesign || true

      - name: Assemble Real IPA
        run: |
          # Flutter가 실제 기계어 바이너리(ARM64)와 에셋을 완성해 둔 디렉터리를 탐색
          echo "=== Locating compiled Runner.app ==="
          APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | grep -E "Release-iphoneos|iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Searching all Runner.app instances..."
            APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app could not be found!"
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 설치 에러를 유발하는 확장 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 표준 ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Generated IPA Details ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa