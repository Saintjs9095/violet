name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Build and Intercept App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          mkdir -p "$RUNNER_TEMP/saved_bundle"

          # 0.5초 간격으로 violet/build 내부의 모든 .app 바이너리를 실시간 탐지하여 복사
          (
            echo "Starting aggressive bundle grabber..."
            while true; do
              for app in $(find "$GITHUB_WORKSPACE/violet/build" -type d -name "*.app" 2>/dev/null); do
                if [ -f "$app/Info.plist" ] && [ -f "$app/Runner" ] && [ -s "$app/Runner" ]; then
                  cp -R "$app" "$RUNNER_TEMP/saved_bundle/Runner.app" 2>/dev/null || true
                fi
              done
              sleep 0.5
            done
          ) &
          DAEMON_PID=$!

          # 5분 동안 전체 네이티브/엔진 AOT 컴파일 수행
          flutter build ipa --release --no-codesign || true

          # 감시 데몬 종료
          kill $DAEMON_PID 2>/dev/null || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating Intercepted Runner.app ==="
          APP_PATH="$RUNNER_TEMP/saved_bundle/Runner.app"

          if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "Searching all candidate locations..."
            APP_PATH=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Compiled executable Runner binary could not be captured!"
            find "$RUNNER_TEMP" "$GITHUB_WORKSPACE/violet/build" -maxdepth 5 || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          # IPA 용량 검증 (최소 10MB)
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa