name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Prepare Flutter Assets & Frameworks
        working-directory: violet
        run: |
          # Flutter Dart 엔진 및 에셋 빌드
          flutter build bundle --release

      - name: Install Pods
        working-directory: violet/ios
        run: pod install

      - name: Build Runner App with xcodebuild
        working-directory: violet/ios
        run: |
          # 메인 타깃(Runner)만 단독 빌드하여 ShareExtension 충돌 완전 회피
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          # 1. 실제 빌드된 Runner.app 경로 찾기
          APP_PATH=$(find violet/ios/derived_data -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app was not found! Build failed."
            exit 1
          fi

          echo "Found compiled app at: $APP_PATH"
          ls -la "$APP_PATH"

          # 2. 표준 Payload 구조로 압축
          rm -rf ipa_build Violet.ipa
          mkdir -p ipa_build/Payload
          cp -R "$APP_PATH" ipa_build/Payload/

          cd ipa_build
          zip -qr ../Violet.ipa Payload
          cd ..

          # 3. 용량 출력 검증
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa