name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean ShareExtension from Podfile
        working-directory: violet/ios
        run: |
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Compile and Capture Real App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 백그라운드에서 빌드 산출물(Runner.app)이 완성되는 즉시 보존 디렉터리로 복사하는 감시 프로세스 실행
          mkdir -p "$RUNNER_TEMP/captured_app"
          (
            while true; do
              FOUND_APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" build -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos|iphoneos" | head -n 1)
              if [ -n "$FOUND_APP" ] && [ -f "$FOUND_APP/Runner" ] && [ -s "$FOUND_APP/Runner" ]; then
                cp -R "$FOUND_APP" "$RUNNER_TEMP/captured_app/" 2>/dev/null || true
              fi
              sleep 2
            done
          ) &
          WATCHER_PID=$!

          # 정식 Flutter 빌드 실행 (200초 이상 실제 컴파일 수행)
          flutter build ios --release --no-codesign || true

          # 감시 프로세스 종료
          kill $WATCHER_PID 2>/dev/null || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Checking captured app bundle ==="
          APP_PATH="$RUNNER_TEMP/captured_app/Runner.app"

          if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "Checking fallback locations..."
            APP_PATH=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | grep -E "captured|Release" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Compiled executable Runner binary was not captured!"
            exit 1
          fi

          echo "Captured valid Runner binary at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 익스텐션 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 표준 압축
          zip -r -q Violet.ipa Payload

          # IPA 용량 검증 (최소 10MB)
          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa