name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

      - name: Build Unsigned Release App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 4~5분간 정규 릴리즈 AOT 컴파일 완주
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating true compiled Runner.app in DerivedData ==="
          
          # 1. Xcode DerivedData 내부의 실제 바이너리가 존재하는 Runner.app 탐색
          APP_PATH=""
          while IFS= read -r candidate; do
            if [ -f "$candidate/Runner" ] && [ -s "$candidate/Runner" ]; then
              APP_PATH="$candidate"
              echo "Found valid compiled bundle with executable at: $APP_PATH"
              break
            fi
          done < <(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos")

          # 2. 시스템 전체 폴백 탐색
          if [ -z "$APP_PATH" ]; then
            echo "Searching all system locations for non-empty Runner binary..."
            REAL_BIN=$(find /Users/runner -type f -name "Runner" -perm +111 -size +1M 2>/dev/null | grep -E "Release-iphoneos/Runner.app/Runner" | head -n 1)
            if [ -n "$REAL_BIN" ]; then
              APP_PATH=$(dirname "$REAL_BIN")
            fi
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Compiled executable Runner binary could not be found!"
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "Runner" -ls || true
            exit 1
          fi

          echo "Final Selected App Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa