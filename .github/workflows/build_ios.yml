name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile and Disable ShareExtension
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 타깃 완전 삭제
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. xcode 스킴 및 프로젝트에서 ShareExtension 참조 제거
          sed -i '' '/ShareExtension.appex/d' Runner.xcodeproj/project.pbxproj || true

      - name: Build Unsigned Release App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # DerivedData를 RUNNER_TEMP로 격리하여 Flutter의 빌드 후 삭제(clean) 영향 차단
          flutter build ios --release --no-codesign --export-options-plist="" || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app in System ==="
          
          # 시스템 전체에서 Info.plist와 실행 파일이 온전히 존재하는 진짜 Runner.app 탐색
          APP_PATH=""
          while IFS= read -r app; do
            if [ -f "$app/Runner" ] && [ -s "$app/Runner" ]; then
              APP_PATH="$app"
              break
            fi
          done < <(find /Users/runner -type d -name "Runner.app" 2>/dev/null | grep -v "/Xcode.app")

          if [ -z "$APP_PATH" ]; then
            echo "::error::Executable Runner binary not found anywhere on disk!"
            find /Users/runner/work -name "Runner" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 잔여 플러그인 확장 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa