name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Pre-build Flutter Frameworks
        working-directory: violet
        run: |
          flutter build ios --config-only --release --no-codesign

      - name: Remove ShareExtension and Configure Ad-Hoc Signing
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. 로컬 임시 서명(Ad-Hoc: "-") 주입 - 개발자 계정 없이 완전한 바이너리 패키징 허용
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGN_STYLE = Manual" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = YES" >> "$cfg"
            echo "CODE_SIGNING_ALLOWED = YES" >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
            echo "PROVISIONING_PROFILE_SPECIFIER = " >> "$cfg"
          done

      - name: Build Runner App (Ad-Hoc)
        working-directory: violet/ios
        run: |
          # Ad-Hoc(-) 서명으로 바이너리를 끝까지 정상 빌드
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into SideStore IPA
        run: |
          APP_PATH=$(find violet/ios/derived_data -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Built Runner.app was not found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore/AltStore 충돌 방지: 불필요한 플러그인 확장 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 표준 압축
          zip -r -q Violet.ipa Payload

          # 파일 크기 검증
          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! Build failed."
            exit 1
          fi

          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa