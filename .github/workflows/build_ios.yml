name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Patch Xcode Project for Ad-Hoc Signing
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 타깃 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. project.pbxproj 내 모든 코드 서명 설정을 Ad-Hoc(-)으로 강제 패치
          python3 -c '
          proj_path = "Runner.xcodeproj/project.pbxproj"
          with open(proj_path, "r") as f:
              content = f.read()
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"-\";")
          content = content.replace("CODE_SIGN_IDENTITY = \"Apple Development\";", "CODE_SIGN_IDENTITY = \"-\";")
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("DevelopmentTeam = \"\";", "DevelopmentTeam = \"-\";")
          with open(proj_path, "w") as f:
              f.write(content)
          print("Successfully patched project.pbxproj to Ad-Hoc signing")
          '

          # 3. xcconfig에 Ad-Hoc 서명 플래그 추가
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "CODE_SIGN_STYLE = Manual" >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
            echo "PROVISIONING_PROFILE_SPECIFIER = " >> "$cfg"
          done

      - name: Build Flutter iOS App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Ad-Hoc 서명 설정이 적용된 상태로 공식 빌드 수행
          flutter build ios --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Searching for compiled Runner.app ==="
          APP_PATH=""

          # 1. Flutter 빌드 기본 산출물 경로 우선 검색
          for candidate in \
            "$GITHUB_WORKSPACE/violet/build/ios/iphoneos/Runner.app" \
            "$GITHUB_WORKSPACE/violet/build/ios/Release-iphoneos/Runner.app" \
            $(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1) \
            $(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1); do
            if [ -d "$candidate" ] && [ -f "$candidate/Info.plist" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app could not be found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -la "$APP_PATH"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 설치 시 충돌하는 잔여 확장 폴더 정리
          rm -rf Payload/Runner.app/PlugIns || true

          # 표준 ZIP 압축
          zip -r -q Violet.ipa Payload

          # 용량 확인 (바이너리 포함 여부)
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa