name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 타깃 블록 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

      - name: Compile and Capture Runner App
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          mkdir -p "$RUNNER_TEMP/saved_app"

          # 백그라운드 데몬: Runner 바이너리가 디스크에 생성되는 순간 격리 디렉터리로 실시간 동기화
          (
            echo "Starting binary capture daemon..."
            while true; do
              # DerivedData 및 build 폴더 내 생성된 Runner 바이너리 감시
              FOUND_BIN=$(find "$HOME/Library/Developer/Xcode/DerivedData" "$GITHUB_WORKSPACE/violet/build" -type f -name "Runner" 2>/dev/null | grep -E "Release-iphoneos/Runner.app/Runner" | head -n 1)
              if [ -n "$FOUND_BIN" ] && [ -s "$FOUND_BIN" ]; then
                APP_DIR=$(dirname "$FOUND_BIN")
                # 바이너리와 리소스가 기록되는 즉시 임시 보존 폴더로 미러링
                rsync -a "$APP_DIR/" "$RUNNER_TEMP/saved_app/Runner.app/" 2>/dev/null || true
              fi
              sleep 0.2
            done
          ) &
          DAEMON_PID=$!

          # 380초간 C++, Rust, Swift, Dart 전체 완벽 컴파일 실행
          flutter build ios --release --no-codesign || true

          # 감시 데몬 종료
          kill $DAEMON_PID 2>/dev/null || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Inspecting Saved App Bundle ==="
          APP_PATH="$RUNNER_TEMP/saved_app/Runner.app"

          # 보존 폴더에 바이너리가 없으면 전체 워크스페이스에서 릴리즈 바이너리 재탐색
          if [ ! -d "$APP_PATH" ] || [ ! -s "$APP_PATH/Runner" ]; then
            echo "Searching system fallbacks..."
            FALLBACK=$(find "$GITHUB_WORKSPACE" "$HOME/Library/Developer/Xcode/DerivedData" -type f -name "Runner" 2>/dev/null | grep -E "Release-iphoneos/Runner.app/Runner" | head -n 1)
            if [ -n "$FALLBACK" ]; then
              APP_PATH=$(dirname "$FALLBACK")
            fi
          fi

          if [ ! -d "$APP_PATH" ] || [ ! -s "$APP_PATH/Runner" ]; then
            echo "::error::Compiled Runner binary could not be captured!"
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa