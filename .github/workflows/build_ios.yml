name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile and Neutralize All Codesigning
        working-directory: violet/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

          # 2. CocoaPods 프레임워크 서명 무력화
          find Targets\ Support\ Files -name "*-frameworks.sh" -exec sed -i '' 's/code_sign_if_enabled/echo "skipped signing"/g' {} + || true

          # 3. Flutter 자체 백엔드 서명 스크립트 무력화
          FLUTTER_ROOT=$(flutter doctor -v | grep "Flutter version" | sed -E 's/.* at (.*)/\1/')
          BACKEND_SCRIPT="$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh"
          if [ -f "$BACKEND_SCRIPT" ]; then
            sed -i '' 's/codesign --force --verbose/echo "bypassing codesign" #/g' "$BACKEND_SCRIPT"
            sed -i '' 's/codesign --force/echo "bypassing codesign" #/g' "$BACKEND_SCRIPT"
          fi

          # 4. PhaseScriptExecution 전용 더미 codesign 생성 후 절대경로 바인딩
          sudo mkdir -p /tmp/bin
          sudo tee /tmp/bin/codesign > /dev/null << 'EOF'
          #!/bin/bash
          exit 0
          EOF
          sudo chmod +x /tmp/bin/codesign

      - name: Build Runner App via xcodebuild
        working-directory: violet/ios
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          export PATH="/tmp/bin:$PATH"

          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xcode_output" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app ==="
          APP_PATH=$(find "$RUNNER_TEMP/xcode_output" -type d -name "Runner.app" | grep -E "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Searching fallback..."
            APP_PATH=$(find "$RUNNER_TEMP" -type d -name "Runner.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Compiled Runner.app not found!"
            find "$RUNNER_TEMP" -maxdepth 4 || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa