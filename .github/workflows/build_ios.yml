name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Inject Dummy Team and Bypass Codesign
        working-directory: violet/ios
        run: |
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          injection = """buildSettings = {
          \t\t\t\tDEVELOPMENT_TEAM = 1234567890;
          \t\t\t\tCODE_SIGN_STYLE = Manual;
          \t\t\t\tCODE_SIGNING_ALLOWED = NO;
          \t\t\t\tCODE_SIGN_IDENTITY = "";"""
          content = content.replace("buildSettings = {", injection)
          with open(path, "w") as f:
              f.write(content)
          '
          echo "DEVELOPMENT_TEAM = 1234567890" >> Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM = 1234567890" >> Flutter/Generated.xcconfig

      - name: Build iOS Release (No codesign)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find violet/build/ios -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          echo "Packaging found app: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Violet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa