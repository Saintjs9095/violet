name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Locate Project Root
        id: locate
        run: |
          PROJ_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory is: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter pub get

      - name: Decouple ShareExtension and Clean Project Safe
        working-directory: ${{ steps.locate.outputs.proj_dir }}/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Ruby xcodeproj로 타깃 의존성 정리 및 Crashlytics 무력화
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("Runner.xcodeproj")

            share_target = project.targets.find { |t| t.name == "ShareExtension" }
            share_target.remove_from_project if share_target

            runner_target = project.targets.find { |t| t.name == "Runner" }
            if runner_target
              runner_target.dependencies.delete_if do |dep|
                dep.target.nil? || dep.target.name == "ShareExtension" || (dep.respond_to?(:display_name) && dep.display_name.to_s.include?("ShareExtension"))
              end

              runner_target.build_phases.delete_if do |phase|
                (phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name.to_s.include?("Extension")) ||
                (phase.respond_to?(:name) && phase.name.to_s.include?("Crashlytics")) ||
                (phase.respond_to?(:shell_script) && phase.shell_script.to_s.include?("crashlytics"))
              end

              runner_target.build_configurations.each do |config|
                config.build_settings["DEVELOPMENT_TEAM"] = "7QZ8ABC99X"
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["CODE_SIGN_IDENTITY"] = "-"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGNING_ALLOWED"] = "YES"
              end
            end

            project.build_configurations.each do |config|
              config.build_settings["DEVELOPMENT_TEAM"] = "7QZ8ABC99X"
            end

            project.save
          '

          # 3. xcscheme에서 ShareExtension 제거
          python3 -c '
          import xml.etree.ElementTree as ET
          import glob

          for p in glob.glob("**/*.xcscheme", recursive=True):
              try:
                  tree = ET.parse(p)
                  root = tree.getroot()
                  changed = False
                  for entries in root.findall(".//BuildActionEntries"):
                      for entry in list(entries):
                          ref = entry.find("BuildableReference")
                          if ref is not None and "ShareExtension" in ref.attrib.get("BlueprintName", ""):
                              entries.remove(entry)
                              changed = True
                  if changed:
                      tree.write(p)
              except Exception:
                  pass
          '

          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "DEVELOPMENT_TEAM = 7QZ8ABC99X" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = -" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGNING_ALLOWED = YES" >> "$cfg"
          done

      - name: Precompile Flutter Dart AOT Engine
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          # Flutter 공식 assemble에 output 디렉터리를 명시하여 App.framework 및 Flutter.framework 사전 완비
          mkdir -p ios/Flutter/App.framework
          flutter assemble -dTargetPlatform=ios -dBuildMode=release -o ios/Flutter release_unpack_ios

      - name: Build Runner App with Native Xcodebuild
        working-directory: ${{ steps.locate.outputs.proj_dir }}/ios
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="7QZ8ABC99X" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Application Bundle ==="
          APP_PATH=""

          # Runner 바이너리가 완벽히 링크된 Runner.app 탐색
          while IFS= read -r candidate; do
            if [ -d "$candidate" ] && [ -f "$candidate/Runner" ]; then
              APP_PATH="$candidate"
              echo "Discovered full bundle with Mach-O binary at: $APP_PATH"
              break
            fi
          done < <(find "$HOME/Library/Developer/Xcode/DerivedData" /Users/runner/work -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos")

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" /Users/runner/work -type d -name "Runner.app" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Target Runner.app directory could not be located!"
            exit 1
          fi

          echo "Target App Path: $APP_PATH"
          ls -la "$APP_PATH"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Info.plist 템플릿 변수 실값 완전 치환
          PLIST_PATH="Payload/Runner.app/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            sed -i '' 's/\$(EXECUTABLE_NAME)/Runner/g' "$PLIST_PATH"
            sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/xyz.project.violet/g' "$PLIST_PATH"
            sed -i '' 's/\$(PRODUCT_NAME)/Violet/g' "$PLIST_PATH"
            sed -i '' 's/\$(FLUTTER_BUILD_NAME)/1.34.3/g' "$PLIST_PATH"
            sed -i '' 's/\$(FLUTTER_BUILD_NUMBER)/1/g' "$PLIST_PATH"
          fi

          chmod 755 "Payload/Runner.app/Runner" 2>/dev/null || true
          file "Payload/Runner.app/Runner" || true
          ls -lh "Payload/Runner.app/Runner" || true

          # 잔여 플러그인 확장 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa