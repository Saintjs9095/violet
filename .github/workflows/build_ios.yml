name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Prepare Flutter Configuration
        working-directory: violet
        run: |
          # Flutter Dart 엔진/에셋 및 CocoaPods 구성 생성
          flutter build ios --config-only --no-codesign

      - name: Strip Signing from Project and Pods
        working-directory: violet/ios
        run: |
          # 1. ShareExtension 타깃 제거 (Podfile)
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '

          # 2. project.pbxproj 내 모든 서명 요구 강제 비활성화
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              if "ShareExtension.appex" in line or ("ShareExtension" in line and "PBXTargetDependency" in line):
                  continue
              if "CODE_SIGN_STYLE" in line:
                  new_lines.append("\t\t\t\tCODE_SIGN_STYLE = Manual;\n")
                  continue
              if "CODE_SIGN_IDENTITY" in line or "DEVELOPMENT_TEAM" in line or "PROVISIONING_PROFILE" in line:
                  continue
              new_lines.append(line)
              if "buildSettings = {" in line:
                  new_lines.append("\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n")
                  new_lines.append("\t\t\t\tDEVELOPMENT_TEAM = \"\";\n")
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Install Pods
        working-directory: violet/ios
        run: pod install

      - name: Build Full Binary with xcodebuild
        working-directory: violet/ios
        run: |
          # CODE_SIGNING_ALLOWED=NO 옵션과 함께 실제 실행 바이너리 빌드
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Real IPA
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE" -name "Runner.app" -type d | grep "derived_data" | grep "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app could not be found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -la "$APP_PATH"

          # Info.plist와 Runner 실행 파일 검증
          if [ ! -f "$APP_PATH/Info.plist" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Runner binary or Info.plist is missing in bundle!"
            exit 1
          fi

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 불필요한 플러그인 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          zip -r -q Violet.ipa Payload

          echo "Generated IPA Size:"
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa