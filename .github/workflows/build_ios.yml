name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Strip Signing from Xcode Configuration
        working-directory: violet/ios
        run: |
          for cfg in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED = NO" >> "$cfg"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$cfg"
            echo "CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$cfg"
            echo "DEVELOPMENT_TEAM = " >> "$cfg"
          done

      - name: Build Flutter IPA (Unsigned Archive)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 259초 동안 Xcode archive를 완벽히 생성한 후 발생하는 서명 체크 에러를 무시하고 진행
          flutter build ipa --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          # 1. 방금 생성 완료된 xcarchive의 Products/Applications 폴더에서 진짜 Runner.app 추출
          echo "=== Locating compiled Runner.app in archive ==="
          APP_PATH=$(find "$GITHUB_WORKSPACE/violet/build/ios/archive" -type d -name "Runner.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Searching all paths for Runner.app..."
            APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" | grep -E "Products/Applications|Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Compiled Runner.app not found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # 2. SideStore용 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore/무료 계정 App ID 충돌 방지를 위해 미사용 익스텐션 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 3. 표준 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa