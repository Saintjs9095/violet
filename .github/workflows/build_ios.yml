name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Locate Project Root
        id: locate
        run: |
          PROJ_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory is: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter pub get

      - name: Decouple ShareExtension from Project and Schemes
        working-directory: ${{ steps.locate.outputs.proj_dir }}/ios
        run: |
          # 1. Podfile에서 ShareExtension 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

          # 2. Ruby xcodeproj로 pbxproj 내 타깃 및 의존성 제거
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("Runner.xcodeproj")
            share_target = project.targets.find { |t| t.name == "ShareExtension" }
            share_target.remove_from_project if share_target

            runner_target = project.targets.find { |t| t.name == "Runner" }
            if runner_target
              runner_target.dependencies.delete_if do |dep|
                dep.target.nil? || dep.target.name == "ShareExtension" || (dep.respond_to?(:display_name) && dep.display_name.to_s.include?("ShareExtension"))
              end
              runner_target.build_phases.delete_if do |phase|
                (phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name.to_s.include?("Extension")) ||
                (phase.respond_to?(:name) && phase.name.to_s.include?("Crashlytics"))
              end
            end
            project.save
          '

          # 3. 모든 .xcscheme 파일에서 ShareExtension 빌드 엔트리 제거 (스킴 불일치 해결)
          python3 -c '
          import xml.etree.ElementTree as ET
          import glob

          for p in glob.glob("**/*.xcscheme", recursive=True):
              try:
                  tree = ET.parse(p)
                  root = tree.getroot()
                  changed = False
                  for entries in root.findall(".//BuildActionEntries"):
                      for entry in list(entries):
                          ref = entry.find("BuildableReference")
                          if ref is not None and "ShareExtension" in ref.attrib.get("BlueprintName", ""):
                              entries.remove(entry)
                              changed = True
                  if changed:
                      tree.write(p)
                      print(f"Cleaned ShareExtension from scheme: {p}")
              except Exception as e:
                  pass
          '

      - name: Build Flutter iOS App Bundle
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 상세 로그를 파일에 기록하여 에러 추적 보장
          flutter build ios --release --no-codesign -v > flutter_build.log 2>&1 || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Inspecting Build Output ==="
          PROJ_DIR="${{ steps.locate.outputs.proj_dir }}"

          # 컴파일 실패 시 상세 로그 출력
          if [ ! -d "$PROJ_DIR/build/ios/Release-iphoneos/Runner.app" ] || [ ! -f "$PROJ_DIR/build/ios/Release-iphoneos/Runner.app/Info.plist" ]; then
            echo "::warning::Runner.app missing. Showing last 120 lines of build log:"
            tail -n 120 "$PROJ_DIR/flutter_build.log" || true
          fi

          TARGET_APP="$PROJ_DIR/build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$TARGET_APP" ]; then
            TARGET_APP=$(find /Users/runner/work "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$TARGET_APP" ] || [ ! -d "$TARGET_APP" ]; then
            echo "::error::Target Runner.app directory could not be located!"
            exit 1
          fi

          echo "Target App Path: $TARGET_APP"
          ls -la "$TARGET_APP"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$TARGET_APP" Payload/

          # Info.plist 템플릿 변수 실값 완전 치환 (SideStore 인식 보장)
          PLIST_PATH="Payload/Runner.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            cp "$PROJ_DIR/ios/Runner/Info.plist" "$PLIST_PATH"
          fi

          sed -i '' 's/\$(EXECUTABLE_NAME)/Runner/g' "$PLIST_PATH"
          sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/xyz.project.violet/g' "$PLIST_PATH"
          sed -i '' 's/\$(PRODUCT_NAME)/Violet/g' "$PLIST_PATH"
          sed -i '' 's/\$(FLUTTER_BUILD_NAME)/1.34.3/g' "$PLIST_PATH"
          sed -i '' 's/\$(FLUTTER_BUILD_NUMBER)/1/g' "$PLIST_PATH"

          # 컴파일된 메인 실행 바이너리 존재 확인 및 권한 부여
          if [ ! -f "Payload/Runner.app/Runner" ]; then
            echo "Searching for compiled executable binary..."
            EXEC_BIN=$(find "$PROJ_DIR/build" "$HOME/Library/Developer/Xcode/DerivedData" -type f -perm +111 -size +500k 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)
            if [ -n "$EXEC_BIN" ]; then
              echo "Found executable: $EXEC_BIN"
              cp -f "$EXEC_BIN" "Payload/Runner.app/Runner"
            fi
          fi

          chmod 755 "Payload/Runner.app/Runner" || true
          ls -lh "Payload/Runner.app/Runner"

          # 불필요한 플러그인 확장 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa