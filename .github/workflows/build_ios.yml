name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Patch project configurations
        working-directory: violet/ios
        run: |
          # pbxproj 내 서명 수동화 및 식별자 제거
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          with open(path, "w") as f:
              f.write(content)
          '
          # Pods 및 Release 설정에 무서명 주입
          echo "CODE_SIGNING_ALLOWED = NO" >> Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> Flutter/Release.xcconfig

      - name: Build Flutter iOS App (Release)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter CLI는 실제 앱 번들을 컴파일 완료한 뒤 마지막 서명 검사에서 exit code 1을 발생시킵니다.
          # 따라서 성공/실패 여부와 관계없이 다음 스텝으로 진행합니다.
          flutter build ios --release --no-codesign || true

      - name: Package Real IPA
        working-directory: violet
        run: |
          # 1. 빌드 완료된 실제 Runner.app 디렉터리 정밀 탐색 (Info.plist가 존재하는 진짜 앱 번들)
          APP_PATH=$(find build/ios/iphoneos -name "Runner.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "Runner.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" -type d | head -n 1)
          fi

          echo "Detected App Bundle: $APP_PATH"

          # 2. 번들 내용물 검사 및 로깅
          ls -la "$APP_PATH"

          # 3. 사이드로딩 표준 패키징
          rm -rf ../ipa_build ../Violet.ipa
          mkdir -p ../ipa_build/Payload
          cp -R "$APP_PATH" ../ipa_build/Payload/

          # SideStore/AltStore 충돌 방지: 불필요한 확장 정리
          rm -rf ../ipa_build/Payload/Runner.app/PlugIns || true

          cd ../ipa_build
          zip -qr ../Violet.ipa Payload
          cd ..

          echo "Final IPA File Details:"
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa