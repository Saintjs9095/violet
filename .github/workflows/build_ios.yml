name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Pre-build Flutter App Bundle
        working-directory: violet
        run: |
          # 서명 검사를 완전히 무시하고 Flutter 빌드 환경 설정만 안전하게 생성
          flutter build ios --config-only --release --no-codesign

      - name: Remove ShareExtension and Configure Pods
        working-directory: violet/ios
        run: |
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Compile Real App Binary via Flutter Assembler
        working-directory: violet
        run: |
          # Dart 코드를 실제 AOT 기계어로 사전 컴파일
          flutter assemble -o ios/Flutter/App.framework -dTargetPlatform=ios -dBuildMode=release release_ios_bundle_flutter_assets

      - name: Build Runner App directly with Xcode
        working-directory: violet/ios
        run: |
          # 무서명(NO) 시 바이너리가 증발하는 버그를 막기 위해
          # 로컬 가짜 서명(Ad-Hoc: "-")을 강제 적용하여 온전한 런타임 앱을 컴파일
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Assemble Real IPA
        run: |
          # derived_data에 안전하게 저장된 실제 Runner.app 추출
          APP_PATH=$(find violet/ios/derived_data -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found under derived_data!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -la "$APP_PATH"

          # Payload 패키징
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 최종 압축
          zip -r -q Violet.ipa Payload

          # IPA 크기 엄격 검증
          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa