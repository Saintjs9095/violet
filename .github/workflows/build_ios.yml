name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Remove ShareExtension Target completely
        working-directory: violet/ios
        run: |
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              if "ShareExtension.appex" in line or ("ShareExtension" in line and "PBXTargetDependency" in line):
                  continue
              if "CODE_SIGN_STYLE" in line:
                  new_lines.append("\t\t\t\tCODE_SIGN_STYLE = Manual;\n")
                  continue
              if "CODE_SIGN_IDENTITY" in line or "DEVELOPMENT_TEAM" in line or "PROVISIONING_PROFILE" in line:
                  continue
              new_lines.append(line)
              if "buildSettings = {" in line:
                  new_lines.append("\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n")
                  new_lines.append("\t\t\t\tDEVELOPMENT_TEAM = \"\";\n")
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Install Pods
        working-directory: violet/ios
        run: pod install

      - name: Compile Flutter Assets and App Framework
        working-directory: violet
        run: |
          # Flutter assemble을 통해 xcodebuild에 필요한 App.framework 및 Flutter 자산 사전 컴파일
          flutter assemble -dTargetPlatform=ios -dBuildMode=release release_ios_bundle_flutter_assets

      - name: Build Runner Target with xcodebuild
        working-directory: violet/ios
        run: |
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find violet/ios/derived_data -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Built app bundle was not found or invalid!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -la "$APP_PATH"

          rm -rf ipa_build Violet.ipa
          mkdir -p ipa_build/Payload
          cp -R "$APP_PATH" ipa_build/Payload/

          rm -rf ipa_build/Payload/Runner.app/PlugIns || true

          cd ipa_build
          zip -qr ../Violet.ipa Payload
          cd ..

          echo "Generated IPA Size:"
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa