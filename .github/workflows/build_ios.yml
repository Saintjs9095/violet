name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Pre-build Flutter Frameworks and Assets
        working-directory: violet
        run: |
          flutter build bundle --release

      - name: Configure CocoaPods
        working-directory: violet/ios
        run: pod install

      - name: Completely Strip Codesign from Xcode Project
        working-directory: violet/ios
        run: |
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              # 기존 서명 관련 라인 제거 및 Manual 전환
              if "CODE_SIGN_IDENTITY" in line or "DEVELOPMENT_TEAM" in line or "PROVISIONING_PROFILE" in line:
                  continue
              if "CODE_SIGN_STYLE" in line:
                  new_lines.append("\t\t\t\tCODE_SIGN_STYLE = Manual;\n")
                  continue
              new_lines.append(line)
              # 모든 buildSettings 블록 시작 시 무서명 강제 삽입
              if "buildSettings = {" in line:
                  new_lines.append("\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n")
                  new_lines.append("\t\t\t\tDEVELOPMENT_TEAM = \"\";\n")

          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Build Runner App
        working-directory: violet/ios
        run: |
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find violet/ios/build -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          echo "Packaging found app from: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Violet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa