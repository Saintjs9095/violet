name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 타깃 블록 제거
          sed -i '' "/target 'ShareExtension' do/,/end/d" Podfile
          pod install

      - name: Build Unsigned Xcode Archive
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 1. Flutter AOT 엔진 및 플러그인 컴파일 (선행 필수 단계)
          flutter build ios --config-only --release --no-codesign

          # 2. xcodebuild archive 명령으로 온전한 무서명 번들 직접 생성
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app in Archive ==="
          
          # 1. xcarchive 내부의 Applications/Runner.app 직접 지정
          APP_PATH="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Searching all xcarchive directories..."
            APP_PATH=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | grep -E "Applications/Runner.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Compiled Runner.app not found in archive!"
            find "$RUNNER_TEMP" -maxdepth 5 || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 잔여 플러그인 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa