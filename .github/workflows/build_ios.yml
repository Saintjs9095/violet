name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Remove ShareExtension from Podfile
        working-directory: violet/ios
        run: |
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Build Unsigned iOS Archive via Flutter
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 258초간 실제 기계어 컴파일 및 아카이브 생성을 완주하고,
          # 마지막 단계의 개발자 팀 서명 유효성 체크 실패(exit 1)를 넘겨 아카이브를 보존합니다.
          flutter build ipa --release --no-codesign || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app in xcarchive or build outputs ==="
          
          # Xcode가 생성한 .xcarchive 내부의 실제 Runner.app 우선 탐색
          APP_PATH=$(find "$GITHUB_WORKSPACE" "$HOME/Library/Developer/Xcode/Archives" -type d -name "Runner.app" 2>/dev/null | grep -E "Applications|archive" | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Searching all candidate locations..."
            APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Compiled Runner.app could not be found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          # 최종 IPA 용량 검증
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa