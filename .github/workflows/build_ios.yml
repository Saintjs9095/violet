name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Inject Dummy Team and Disable Codesigning
        working-directory: violet/ios
        run: |
          # 1. pbxproj 내 모든 Target의 buildSettings 블록에 더미 Team ID와 무서명 플래그 강제 주입
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              new_lines.append(line)
              if "buildSettings = {" in line:
                  new_lines.append("\t\t\t\tDEVELOPMENT_TEAM = 1234567890;\n")
                  new_lines.append("\t\t\t\tCODE_SIGN_STYLE = Manual;\n")
                  new_lines.append("\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n")
                  new_lines.append("\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n")

          with open(path, "w") as f:
              f.writelines(new_lines)
          '

          # 2. Flutter 설정 파일들에도 주입
          for f in Flutter/Release.xcconfig Flutter/Generated.xcconfig Flutter/AppFrameworkInfo.plist; do
            if [ -f "$f" ] && [[ "$f" == *.xcconfig ]]; then
              echo "DEVELOPMENT_TEAM = 1234567890" >> "$f"
              echo "CODE_SIGNING_ALLOWED = NO" >> "$f"
              echo "CODE_SIGNING_REQUIRED = NO" >> "$f"
              echo "CODE_SIGN_IDENTITY = " >> "$f"
            fi
          done

      - name: Build iOS Release App
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find violet/build/ios -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find violet -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          fi
          echo "Packaging found app: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Violet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa