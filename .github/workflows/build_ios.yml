name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Build Runner IPA
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # Flutter 자체 빌드 파이프라인을 통해 정규 바이너리 및 프레임워크를 온전히 빌드
          flutter build ios --release --no-codesign || true

          # DerivedData 및 build 디렉터리 내 완성된 번들 탐색
          APP_DIR=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "Runner.app" -type d | head -n 1)
          fi

          echo "Found app at: $APP_DIR"

          # 빌드 완료된 번들을 xcodebuild로 직접 ad-hoc 아카이빙/패키징
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find violet/build_output -name "Runner.app" -type d | grep "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app could not be found!"
            exit 1
          fi

          echo "Using compiled bundle: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 불필요한 플러그인 확장 제거
          rm -rf Payload/Runner.app/PlugIns || true

          zip -r -q Violet.ipa Payload

          echo "=== Final IPA File ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa