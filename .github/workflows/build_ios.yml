name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Configure Flutter and Remove ShareExtension
        working-directory: violet/ios
        run: |
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Build Runner Release (Preserve Build Dir)
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # output 디렉터리를 명시하여 컴파일된 번들이 자동 삭제되지 않게 고정
          flutter build ios --release --no-codesign || true

      - name: Assemble Real IPA
        run: |
          echo "=== Searching for compiled Runner.app ==="
          
          # Xcode 빌드 산출물 기본 경로 전체 검색
          APP_PATH=$(find "$RUNNER_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Runner.app" 2>/dev/null | grep -E "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Listing found Runner.app files:"
            find "$RUNNER_WORKSPACE" -name "Runner.app" || true
            find "$HOME/Library/Developer" -name "Runner.app" || true
            echo "::error::Compiled Runner.app not found!"
            exit 1
          fi

          echo "Found compiled app bundle at: $APP_PATH"
          ls -lh "$APP_PATH"

          # SideStore 규격 Payload 패키징
          rm -rf ipa_build Violet.ipa
          mkdir -p ipa_build/Payload
          cp -R "$APP_PATH" ipa_build/Payload/

          # 확장 기능 제거
          rm -rf ipa_build/Payload/Runner.app/PlugIns || true

          cd ipa_build
          zip -r -q ../Violet.ipa Payload
          cd ..

          echo "=== Generated IPA Details ==="
          ls -lh Violet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa