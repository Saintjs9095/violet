name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Compile and Lock App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 아카이브 폴더를 미리 만들고 복사 대상 경로 준비
          mkdir -p "$RUNNER_TEMP/locked_app"

          # 백그라운드에서 실시간으로 생성되는 Runner.app 감시 및 잠금 복사 데몬
          (
            echo "Starting aggressive app bundle grabber..."
            while true; do
              # 1. build 디렉터리 내 완성된 Runner 바이너리 탐지
              FOUND_APP=$(find build -type d -name "Runner.app" 2>/dev/null | grep -E "archive|Release|iphoneos" | head -n 1)
              if [ -n "$FOUND_APP" ] && [ -f "$FOUND_APP/Runner" ] && [ -s "$FOUND_APP/Runner" ]; then
                cp -R "$FOUND_APP" "$RUNNER_TEMP/locked_app/" 2>/dev/null || true
                # Flutter의 자동 삭제를 방지하기 위해 불변(Immutable) 플래그 주입
                chflags -R uchg "$RUNNER_TEMP/locked_app/Runner.app" 2>/dev/null || true
              fi
              sleep 0.2
            done
          ) &
          DAEMON_PID=$!

          # 258초간 정규 Flutter 네이티브/AOT 컴파일 완주
          flutter build ipa --release --no-codesign || true

          # 감시 데몬 종료
          kill $DAEMON_PID 2>/dev/null || true

          # 보존된 번들의 잠금 해제 (SideStore 패키징 작업을 위해)
          chflags -R nouchg "$RUNNER_TEMP/locked_app" 2>/dev/null || true

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Checking Captured Bundle ==="
          APP_PATH="$RUNNER_TEMP/locked_app/Runner.app"

          if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "Deep searching whole system..."
            APP_PATH=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type d -name "Runner.app" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Compiled Runner.app not found!"
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # SideStore 표준 Payload 디렉터리 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # SideStore 충돌 방지: 잔여 확장 플러그인 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # 표준 ZIP 압축
          zip -r -q Violet.ipa Payload

          # 용량 검증 (바이너리 포함 필수 10MB 이상)
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa