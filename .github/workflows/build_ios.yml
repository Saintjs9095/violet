name: Build iOS IPA

on:
  push:
    branches: [ dev, master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Disable Code Signing across Project
        working-directory: violet/ios
        run: |
          # 1. xcconfig 설정에 강제 무서명 플래그 삽입
          for config in Flutter/Release.xcconfig Flutter/Generated.xcconfig; do
            echo "CODE_SIGNING_ALLOWED=NO" >> "$config"
            echo "CODE_SIGNING_REQUIRED=NO" >> "$config"
            echo "CODE_SIGN_IDENTITY=" >> "$config"
            echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "$config"
          done

          # 2. project.pbxproj 내 모든 타깃의 서명 요구 제거
          python3 -c '
          path = "Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()

          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("CODE_SIGN_IDENTITY = \"iPhone Developer\";", "CODE_SIGN_IDENTITY = \"\";")
          content = content.replace("\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"iPhone Developer\";", "\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"\";")

          with open(path, "w") as f:
              f.write(content)
          '

      - name: Build iOS Release App
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find violet/build/ios -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find violet -name "Runner.app" -type d | grep -E "Release-iphoneos" | head -n 1)
          fi
          echo "Packaging found app: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Violet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa