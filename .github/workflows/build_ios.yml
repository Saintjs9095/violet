name: Build iOS IPA

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        working-directory: violet
        run: flutter pub get

      - name: Clean Podfile
        working-directory: violet/ios
        run: |
          # Podfile에서 ShareExtension 제거
          python3 -c '
          with open("Podfile", "r") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          for line in lines:
              if "target '\''ShareExtension'\''" in line:
                  skip = True
                  continue
              if skip and line.strip() == "end":
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          with open("Podfile", "w") as f:
              f.writelines(new_lines)
          '
          pod install

      - name: Build Unsigned Release App Bundle
        working-directory: violet
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          # 서명 검증 없이 완전한 릴리즈 arm64 번들 생성
          flutter build ios --simulator --release

      - name: Package Payload into SideStore IPA
        run: |
          echo "=== Locating compiled Runner.app ==="
          APP_PATH=$(find "$GITHUB_WORKSPACE/violet/build/ios" -type d -name "Runner.app" 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Runner.app was not found!"
            find "$GITHUB_WORKSPACE/violet/build" -ls || true
            exit 1
          fi

          echo "Target Bundle Path: $APP_PATH"
          ls -lh "$APP_PATH/Runner"

          # 바이너리 아키텍처 확인 (arm64 확인용)
          file "$APP_PATH/Runner"

          # SideStore/실기기 배포 호환성을 위해 Info.plist의 시뮬레이터 플래그를 실기기용으로 변환
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneOS"]' "$APP_PATH/Info.plist" || true
          plutil -replace DTPlatformName -string "iphoneos" "$APP_PATH/Info.plist" || true

          # SideStore 표준 Payload 구성
          rm -rf Payload Violet.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 잔여 플러그인 폴더 제거
          rm -rf Payload/Runner.app/PlugIns || true

          # ZIP 압축
          zip -r -q Violet.ipa Payload

          # IPA 용량 검증
          echo "=== Final IPA File Details ==="
          ls -lh Violet.ipa

          IPA_SIZE=$(stat -f%z Violet.ipa 2>/dev/null || stat -c%s Violet.ipa 2>/dev/null || echo 0)
          echo "Final IPA Size in bytes: $IPA_SIZE"

          if [ "$IPA_SIZE" -lt 10000000 ]; then
            echo "::error::Violet.ipa is smaller than 10MB! ($IPA_SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Custom-IPA
          path: Violet.ipa